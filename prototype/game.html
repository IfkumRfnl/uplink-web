<!doctype html><html><head><meta charset="utf-8"><title>Uplink · private C++ port</title><style>html,body{margin:0;background:#020811;color:#a6cddd;font:13px system-ui}header,footer{padding:10px 20px}canvas{display:block;max-width:100%;margin:auto}#log{white-space:pre-wrap;max-height:160px;overflow:auto;margin:10px 20px}button{background:#163241;border:1px solid #527487;color:#c6e1ec;padding:8px 14px;margin-right:10px}</style></head><body><header>Uplink · private C++ browser port · experimental<br><span id="status">Loading…</span></header><canvas id="canvas" tabindex="0" width="1024" height="768"></canvas><footer><button id="flush">Flush saves</button><button id="debug">Read game log</button><span id="save-status">Restoring local saved data…</span></footer><pre id="log"></pre><script>
var Module={canvas:document.getElementById('canvas'),arguments:['-graphics_fullscreen','!graphics_screenwidth','1024','!graphics_screenheight','768'],print:s=>document.getElementById('log').textContent+=s+'\n',printErr:s=>document.getElementById('log').textContent+=s+'\n',setStatus:s=>document.getElementById('status').textContent=s||'Game bundle loaded',onAbort:e=>document.getElementById('status').textContent='Stopped: '+e};
document.getElementById('flush').onclick=async()=>{try{await Module.uplinkFlushSaves();document.getElementById('save-status').textContent='Saved to browser storage';}catch(e){document.getElementById('save-status').textContent='Save failed: '+e;}};
document.getElementById('debug').onclick=()=>{try{document.getElementById('log').textContent=Module.FS.readFile('/persistent/.uplink/debug.log',{encoding:'utf8'});}catch(e){document.getElementById('log').textContent+='\nGame log not ready: '+e;}};
setInterval(()=>{const s=Module.uplinkPersistence;if(!s)return;document.getElementById('save-status').textContent=s.lastError?'Save storage error: '+s.lastError:!s.ready?'Restoring local saved data…':s.pending?'Saving to browser storage…':s.lastSavedAt?'Saved to browser storage':'Browser storage ready';},500);
</script><script src="game.js"></script></body></html>
