name: Build, test and deploy Uplink Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash port/bootstrap.sh
      - run: npm run build
      - run: npm test
      - run: python3 port/verify-inventory.py
      - run: npx playwright install --with-deps chromium
      - name: Test browser platform and storage
        run: |
          npm run test:browser-renderer-probe
          npm run test:browser-harness
          npm run test:browser-storage
          npm run test:browser-lifecycle
          npm run test:browser-display
      - run: npm run prepare:pages
      - name: Test original game under the Pages subpath
        run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: qa/
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested game
        id: deployment
        uses: actions/deploy-pages@v4
