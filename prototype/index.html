<!doctype html><html><head><meta charset="utf-8"><title>Uplink · private feasibility build</title><style>body{margin:0;background:#040c17;color:#9dcedc;font:14px system-ui;text-align:center}header{padding:20px}h1{font-size:18px;font-weight:500;margin:0 0 8px}canvas{width:min(100%,1000px);aspect-ratio:4/3;outline:1px solid #21414c}footer{padding:15px;line-height:1.8}a{color:#8bd1e7}#log{white-space:pre-wrap;font-size:11px;text-align:left;max-width:1000px;margin:auto;max-height:120px;overflow:auto}</style></head><body><header><h1>Uplink · private browser feasibility build</h1><span id="status">Loading original C++ WebAssembly…</span></header><canvas id="canvas" tabindex="0" width="800" height="600"></canvas><footer><span id="save-status">Persistent storage initializing</span><br><span id="audio-status">Audio starts only after a click</span></footer><pre id="log"></pre><script>
